- id: automation.autolight_toiltet
  alias: Авто-включение света в туалете
  room: toilet
  use_blueprint:
    path: domovoy/presence.yaml
    input:
      presence_sensor: binary_sensor.presence_toilet_presence
      light: light.light_group_toilet
      manual_flag: input_boolean.stop_toilet
      color_temp: sensor.light_color_temp
      brightness: sensor.light_brightness

- id: automation.wall_switch_andrey
  alias: Выключатель света в кабинете Андрея
  room: andrey
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  use_blueprint:
    path: domovoy/wall-switch.yaml
    input:
      wall_switch: 2d30ab78a44cd462ac7d142927c6e6b5
      light_group: light.light_group_andrey

