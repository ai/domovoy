- id: automation.cat_alone_mode
  alias: Режим «Кошка одна»
  triggers:
    - trigger: state
      entity_id: input_boolean.cat_alone
      to: 'on'
      id: 'on'
    - trigger: state
      entity_id: input_boolean.cat_alone
      to: 'off'
      id: 'off'
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: 'on'
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.empty_home
            - action: cover.close_cover
              target:
                entity_id:
                  - cover.shutter_andrey
                  - cover.shutter_bedroom
            - action: cover.set_cover_position
              target:
                entity_id: cover.shutter_lounge
              data:
                position: 40
            - action: script.turn_off_everything
            - action: climate.turn_off
              target:
                entity_id:
                  - climate.ac_lounge
        - conditions:
            - condition: trigger
              id: 'off'
          sequence:
            - action: cover.open_cover
              target:
                entity_id:
                  - cover.shutter_andrey
                  - cover.shutter_lounge
            - action: cover.set_cover_position
              target:
                entity_id: cover.shutter_bedroom
              data:
                position: 10
  mode: single

- id: automation.empty_home_button
  alias: Кнопка «Пустой дом»
  room: entrance
  triggers:
    - trigger: device
      domain: mqtt
      device_id: 051afa3d576af13df00f57ac4f8a7ff6
      type: action
      subtype: toggle_b1_down
      id: set
    - trigger: device
      domain: mqtt
      device_id: 051afa3d576af13df00f57ac4f8a7ff6
      type: action
      subtype: toggle_b2_down
      id: vacuum
    - trigger: device
      domain: mqtt
      device_id: 051afa3d576af13df00f57ac4f8a7ff6
      type: action
      subtype: toggle_b1_up
      id: clear
    - trigger: device
      domain: mqtt
      device_id: 051afa3d576af13df00f57ac4f8a7ff6
      type: action
      subtype: toggle_b2_up
      id: turn_off
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: clear
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.empty_home
        - conditions:
            - condition: trigger
              id: turn_off
          sequence:
            - action: script.turn_on
              target:
                entity_id: script.turn_off_everything
      default:
        - action: script.turn_on
          target:
            entity_id: script.empty_home
        - if:
            - condition: trigger
              id: vacuum
          then:
            - action: vacuum.start
              target:
                entity_id: vacuum.vacuum_q7_max
  mode: single

- id: automation.empty_home_devices
  alias: Выключить всё в пустом доме
  triggers:
    - trigger: state
      entity_id: input_boolean.empty_home
      to: 'on'
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - action: script.turn_off_everything
    - action: climate.turn_off
      metadata: {}
      target:
        entity_id: climate.ac_andrey
      data: {}
  mode: single

- id: automation.empty_home_presence
  alias: Обновление «Пустой дом»
  room: entrance
  triggers:
    - trigger: state
      entity_id: zone.home
      from: '0'
      id: arrived
    - trigger: state
      entity_id: zone.home
      to: '0'
      id: emptied
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: arrived
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.empty_home
        - conditions:
            - condition: trigger
              id: emptied
            - condition: state
              entity_id: timer.empty_home
              state: active
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.empty_home
  mode: single
