- id: automation.ac_andrey_night_off
  alias: Выключить кондиционер Андрея ночью
  room: andrey
  triggers:
    - trigger: time
      at: '20:00:00'
    - trigger: numeric_state
      entity_id: sensor.ac_andrey_outside_temperature
      below: 30
    - trigger: time
      at: '00:00:00'
      id: midnight
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
    - condition: state
      entity_id: input_boolean.cooling
      state: 'on'
    - condition: or
      conditions:
        - condition: trigger
          id: midnight
        - condition: and
          conditions:
            - condition: time
              after: '20:00:00'
            - condition: numeric_state
              entity_id: sensor.ac_andrey_outside_temperature
              below: 30
  actions:
    - action: climate.turn_off
      target:
        entity_id: climate.ac_andrey
  mode: single

- id: automation.ac_andrey_toggle
  alias: Тумблер кондиционера Андрея
  room: andrey
  triggers:
    - trigger: state
      entity_id: input_boolean.ac_andrey
      to: 'on'
    - trigger: state
      entity_id: input_boolean.ac_andrey
      to: 'off'
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - delay: '00:00:02'
    - if:
        - condition: state
          entity_id: timer.ac_andrey
          state: active
      then:
        - wait_for_trigger:
            - trigger: state
              entity_id: timer.ac_andrey
              to: idle
          timeout: '00:00:15'
          continue_on_timeout: true
    - if:
        - condition: state
          entity_id: input_boolean.ac_andrey
          state: 'on'
      then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.ac_andrey
          data:
            hvac_mode: "{{ 'heat' if is_state('input_boolean.heating', 'on') else 'cool' }}"
      else:
        - action: climate.turn_off
          target:
            entity_id: climate.ac_andrey
    - action: timer.start
      target:
        entity_id: timer.ac_andrey
  mode: restart

- id: automation.ac_lounge_night_max_fan
  alias: Максимальный обдув кондиционера зала ночью
  room: lounge
  triggers:
    - trigger: time
      at: '00:00:00'
      id: max
    - trigger: time
      at: '04:00:00'
      id: restore
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
    - condition: state
      entity_id: input_boolean.cooling
      state: 'on'
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: max
            - condition: state
              entity_id: climate.ac_lounge
              state: cool
          sequence:
            - action: climate.set_fan_mode
              target:
                entity_id: climate.ac_lounge
              data:
                fan_mode: '5'
        - conditions:
            - condition: trigger
              id: restore
            - condition: template
              value_template: "{{ state_attr('climate.ac_lounge', 'fan_mode') == '5' }}"
          sequence:
            - action: climate.set_fan_mode
              target:
                entity_id: climate.ac_lounge
              data:
                fan_mode: auto
  mode: single

- id: automation.ac_lounge_on_arrival
  alias: Включить кондиционер зала при возвращении домой
  room: lounge
  triggers:
    - trigger: zone
      entity_id:
        - person.andrey
        - person.kate
      zone: zone.near_home
      event: enter
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
    - condition: state
      entity_id: input_boolean.cooling
      state: 'on'
    - condition: state
      entity_id: input_boolean.empty_home
      state: 'on'
    - condition: template
      value_template: "{{ trigger.from_state.state == 'not_home' }}"
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.ac_lounge
  mode: single

- id: automation.ac_lounge_toggle
  alias: Тумблер кондиционера зала
  room: lounge
  triggers:
    - trigger: state
      entity_id: input_boolean.ac_lounge
      to: 'on'
    - trigger: state
      entity_id: input_boolean.ac_lounge
      to: 'off'
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - delay: '00:00:02'
    - if:
        - condition: state
          entity_id: timer.ac_lounge
          state: active
      then:
        - wait_for_trigger:
            - trigger: state
              entity_id: timer.ac_lounge
              to: idle
          timeout: '00:00:15'
          continue_on_timeout: true
    - if:
        - condition: state
          entity_id: input_boolean.ac_lounge
          state: 'on'
      then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.ac_lounge
          data:
            hvac_mode: "{{ 'heat' if is_state('input_boolean.heating', 'on') else 'cool' }}"
      else:
        - action: climate.turn_off
          target:
            entity_id: climate.ac_lounge
    - action: timer.start
      target:
        entity_id: timer.ac_lounge
  mode: restart

- id: automation.ac_toggle_sync
  alias: Синхронизация тумблеров кондиционеров
  triggers:
    - trigger: state
      entity_id:
        - climate.ac_lounge
        - climate.ac_andrey
      to:
        - 'off'
        - heat
        - dry
        - cool
        - fan_only
        - heat_cool
    - trigger: state
      entity_id:
        - timer.ac_lounge
        - timer.ac_andrey
      to: idle
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - repeat:
        for_each:
          - climate: climate.ac_lounge
            toggle: input_boolean.ac_lounge
            timer: timer.ac_lounge
            automation: automation.ac_lounge_toggle
          - climate: climate.ac_andrey
            toggle: input_boolean.ac_andrey
            timer: timer.ac_andrey
            automation: automation.ac_andrey_toggle
        sequence:
          - choose:
              - conditions:
                  - "{{ is_state(repeat.item.timer, 'active') or state_attr(repeat.item.automation, 'current') | int(0) > 0 }}"
                sequence: []
              - conditions:
                  - "{{ states(repeat.item.climate) in ['unavailable', 'unknown'] }}"
                sequence: []
              - conditions:
                  - "{{ is_state(repeat.item.climate, 'off') }}"
                sequence:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: '{{ repeat.item.toggle }}'
            default:
              - action: input_boolean.turn_on
                target:
                  entity_id: '{{ repeat.item.toggle }}'
  mode: restart

- id: automation.heating_cooling_interlock
  alias: Взаимоблокировка обогрева и охлаждения
  triggers:
    - trigger: state
      entity_id: input_boolean.cooling
      to: 'on'
      id: cooling
    - trigger: state
      entity_id: input_boolean.heating
      to: 'on'
      id: heating
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: cooling
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.heating
        - conditions:
            - condition: trigger
              id: heating
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.cooling
  mode: single
