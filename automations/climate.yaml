- id: automation.ac_andrey_night_off
  alias: Выключить кондиционер Андрея ночью
  room: andrey
  triggers:
    - trigger: time
      at: '20:00:00'
    - trigger: numeric_state
      entity_id: sensor.ac_andrey_outside_temperature
      below: 30
    - trigger: time
      at: '00:00:00'
      id: midnight
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
    - condition: state
      entity_id: input_boolean.cooling
      state: 'on'
    - condition: or
      conditions:
        - condition: trigger
          id: midnight
        - condition: and
          conditions:
            - condition: time
              after: '20:00:00'
            - condition: numeric_state
              entity_id: sensor.ac_andrey_outside_temperature
              below: 30
  actions:
    - action: climate.turn_off
      target:
        entity_id: climate.ac_andrey
  mode: single

- id: automation.ac_andrey_toggle
  alias: Тумблер кондиционера Андрея
  room: andrey
  triggers:
    - trigger: state
      entity_id: input_boolean.ac_andrey
      to: 'on'
      id: 'on'
    - trigger: state
      entity_id: input_boolean.ac_andrey
      to: 'off'
      id: 'off'
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: 'on'
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.ac_andrey
              data:
                hvac_mode: "{{ 'heat' if is_state('input_boolean.heating', 'on') else 'cool' }}"
        - conditions:
            - condition: trigger
              id: 'off'
          sequence:
            - action: climate.turn_off
              target:
                entity_id: climate.ac_andrey
  mode: restart

- id: automation.ac_lounge_toggle
