- id: automation.autolight_bathroom
  alias: Авто-включение света в ванной
  room: bathroom
  use_blueprint:
    path: domovoy/presence.yaml
    input:
      presence_sensor: binary_sensor.presence_bathroom_presence
      lights: []
      manual_flag: input_boolean.stop_bathroom
      disable_flag: input_boolean.empty_home
      off_delay:
        hours: 0
        minutes: 1
        seconds: 0
      before_on:
        - if:
            - condition: state
              entity_id:
                - switch.wall_switch_bathroom_shelly_light
                - switch.switch_bathroom_mirror_shelly_light
              state: 'off'
          then:
            - action: switch.turn_on
              target:
                entity_id:
                  - switch.wall_switch_bathroom_shelly_light
                  - switch.switch_bathroom_mirror_shelly_light
      after_off:
        - action: switch.turn_off
          target:
            entity_id:
              - switch.wall_switch_bathroom_shelly_light
              - switch.switch_bathroom_mirror_shelly_light

- id: automation.autolight_entrance
  alias: Авто-включение света в прихожей
  room: entrance
  use_blueprint:
    path: domovoy/presence.yaml
    input:
      presence_sensor: binary_sensor.presence_entrance_presence
      manual_flag: input_boolean.stop_entrance
      disable_flag: input_boolean.empty_home
      brightness: sensor.light_brightness_entrance
      lights:
        - light.light_group_entrance

- id: automation.autolight_entrance_door
  alias: Свет в прихожей при открытии двери
  room: entrance
  triggers:
    - trigger: state
      entity_id: binary_sensor.door_main
      from: 'off'
      to: 'on'
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
    - condition: state
      entity_id: light.light_group_entrance
      state: 'off'
    - alias: Не ночной режим
      condition: state
      entity_id: sensor.private_room_light_brightness
      state: '100'
  actions:
    - action: light.turn_on
      target:
        entity_id: light.light_group_entrance
      data:
        brightness_pct: "{{ states('sensor.light_brightness_entrance') | int(100) }}"
    - wait_template: "{{ is_state('binary_sensor.presence_entrance_presence', 'on') }}"
      timeout: '00:01:00'
    - if:
        - condition: template
          value_template: '{{ wait.completed }}'
      then:
        - wait_for_trigger:
            - trigger: state
              entity_id: binary_sensor.presence_entrance_presence
              to: 'off'
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
    - condition: state
      entity_id: input_boolean.stop_entrance
      state: 'off'
    - action: light.turn_off
      target:
        entity_id: light.light_group_entrance
  mode: restart

