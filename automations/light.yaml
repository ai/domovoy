- id: automation.wall_switch_bathroom_mirror
  alias: Свет зеркала по выключателю в ванной
  room: bathroom
  triggers:
    - trigger: device
      id: single
      domain: shelly
      device_id: 17682b222003304b636f481a417703d1
      type: single_push
      subtype: button1
    - trigger: device
      id: hold
      domain: shelly
      device_id: 17682b222003304b636f481a417703d1
      type: long_push
      subtype: button1
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - if:
        - condition: trigger
          id: hold
      then:
        - action: switch.toggle
          target:
            entity_id: switch.switch_bathroom_mirror_shelly_light
      else:
        - if:
            - condition: state
              entity_id: switch.wall_switch_bathroom_shelly_light
              state: 'off'
          then:
            - if:
                - condition: state
                  entity_id: switch.switch_bathroom_mirror_shelly_light
                  state: 'on'
              then:
                - action: switch.turn_off
                  target:
                    entity_id: switch.switch_bathroom_mirror_shelly_light
              else:
                - action: switch.turn_on
                  target:
                    entity_id:
                      - switch.wall_switch_bathroom_shelly_light
                      - switch.switch_bathroom_mirror_shelly_light
          else:
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.wall_switch_bathroom_shelly_light
                  - switch.switch_bathroom_mirror_shelly_light
  mode: single

