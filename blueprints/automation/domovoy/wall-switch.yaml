blueprint:
  name: Wall switch
  domain: automation
  author: Andrey Sitnik
  source_url: https://github.com/ai/domovoy/blob/main/blueprints/automation/domovoy/wall-switch.yaml
  input:
    wall_switch:
      name: Switch
      selector:
        device:
          filter:
            - integration: shelly
    button:
      name: Button
      description: >-
        Button that controls the light on the switch if it has multiple buttons
      default: button1
      selector:
        select:
          options:
            - button1
            - button2
    light_group:
      name: Light group
      selector:
        entity:
          filter:
            - domain: light
    manual_flag:
      name: Manual flag
      description: >-
        Use it in motion-based automations to block auto-off after a manual switch
      default: ''
      selector:
        entity:
          filter:
            - domain: input_boolean
    color_temp:
      name: Color temperature
      description: >-
        Sensor with the color temperature in K to turn the light on with
      default: ''
      selector:
        entity:
          filter:
            - domain: sensor
    night_brightness:
      name: Night mode brightness
      description: >-
        Lamps emit no light at all below their own threshold, raise it per room
      default: 5
      selector:
        number:
          min: 1
          max: 50

variables:
  light_group: !input light_group
  manual_flag: !input manual_flag
  color_temp: !input color_temp
  night_brightness: !input night_brightness
  # Clamped to the group, as its lamps may not share the same range
  color_temp_kelvin: >-
    {{ [[states(color_temp) | int(0),
         state_attr(light_group, 'min_color_temp_kelvin') | int(2202)] | max,
        state_attr(light_group, 'max_color_temp_kelvin') | int(6535)] | min }}

mode: single

triggers:
  - trigger: device
    id: single
    domain: shelly
    device_id: !input wall_switch
    type: single_push
    subtype: !input button
  - trigger: device
    id: hold
    domain: shelly
    device_id: !input wall_switch
    type: long_push
    subtype: !input button

conditions: []

actions:
  - if:
      - condition: trigger
        id: single
    then:
      - if:
          - condition: state
            entity_id: !input light_group
            state: 'off'
        then:
          # Override the brightness the bulbs remember, otherwise the light
          # comes back at night mode level. No transition key: it would make
          # Zigbee2MQTT ramp instead of switching (the lamps still have a
          # ~0.3s hardware soft-start that nothing can turn off)
          - action: light.turn_on
            target:
              entity_id: !input light_group
            data: >-
              {{ { 'brightness': 255 } if color_temp == '' else
                 { 'brightness': 255, 'color_temp_kelvin': color_temp_kelvin } }}
          - if:
              - condition: template
                value_template: "{{ manual_flag != '' }}"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: '{{ manual_flag }}'
        else:
          # Without transition this is a plain Zigbee Off command; with one
          # it becomes a dim-to-zero ramp
          - action: light.turn_off
            target:
              entity_id: !input light_group
          - if:
              - condition: template
                value_template: "{{ manual_flag != '' }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: '{{ manual_flag }}'
    else:
      - if:
          - condition: template
            value_template: >-
              {{ is_state(light_group, 'on') and
                 state_attr(light_group, 'brightness') | int(0) <= night_brightness }}
        then:
          # Leave night mode at full brightness
          - action: light.turn_on
            target:
              entity_id: !input light_group
            data:
              brightness: 255
        else:
          - action: light.turn_on
            target:
              entity_id: !input light_group
            data:
              brightness: "{{ night_brightness }}"
              color_temp_kelvin: "{{ state_attr(light_group, 'min_color_temp_kelvin') | int(2202) }}"
      - if:
          - condition: template
            value_template: "{{ manual_flag != '' }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: '{{ manual_flag }}'
