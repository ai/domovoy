- id: automation.ac_toggle_sync
  alias: Синхронизация тумблеров кондиционеров
  triggers:
    - trigger: state
      entity_id:
        - climate.ac_lounge
        - climate.ac_andrey
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - repeat:
        for_each:
          - climate: climate.ac_lounge
            toggle: input_boolean.ac_lounge
          - climate: climate.ac_andrey
            toggle: input_boolean.ac_andrey
        sequence:
          - choose:
              - conditions:
                  - "{{ states(repeat.item.climate) in ['unavailable', 'unknown'] }}"
                sequence: []
              - conditions:
                  - "{{ is_state(repeat.item.climate, 'off') }}"
                sequence:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: '{{ repeat.item.toggle }}'
            default:
              - action: input_boolean.turn_on
                target:
                  entity_id: '{{ repeat.item.toggle }}'
  mode: restart

- id: automation.heating_cooling_interlock
  alias: Взаимоблокировка обогрева и охлаждения
  triggers:
    - trigger: state
      entity_id: input_boolean.cooling
      to: 'on'
      id: cooling
    - trigger: state
      entity_id: input_boolean.heating
      to: 'on'
      id: heating
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: cooling
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.heating
        - conditions:
            - condition: trigger
              id: heating
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.cooling
  mode: single
