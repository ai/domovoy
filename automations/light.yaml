- id: automation.wall_switch_lounge_extra
  alias: Дополнительный выключатель света в зале
  room: lounge
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  use_blueprint:
    input:
      after_off:
        - action: light.turn_off
          data: {}
          metadata: {}
          target:
            entity_id: light.light_chandelier
      before_on:
        - action: light.turn_on
          data:
            brightness_pct: 75
            color_temp_kelvin: 2513
          metadata: {}
          target:
            device_id: e99ab7283456288ab6c9d50cbf84d6b5
      light_group: light.light_group_lounge
      wall_switch: 1ea952a14899eaa04451a3126f8b3196
    path: domovoy/wall-switch.yaml

- id: automation.wall_switch_lounge_real
  alias: Настоящий выключатель света в зале
  room: lounge
  use_blueprint:
    path: domovoy/wall-switch.yaml
    input:
      wall_switch: af88ab836a83c91e4db5e0c13d5290d1
      light_group: light.light_group_lounge
      before_on:
        - action: light.turn_on
          metadata: {}
          target:
            device_id: e99ab7283456288ab6c9d50cbf84d6b5
          data:
            brightness_pct: 75
            color_temp_kelvin: 2513
      after_off:
        - action: light.turn_off
          metadata: {}
          target:
            entity_id: light.light_chandelier
          data: {}

