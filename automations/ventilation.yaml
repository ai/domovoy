- id: automation.bathroom_fan_humidity
  alias: Вентилятор в ванной по влажности
  room: bathroom
  triggers:
    - trigger: template
      id: high
      value_template: "{% set b = states('sensor.air_bathroom_humidity')|float(none) %}{% set k = states('sensor.home_background_humidity')|float(none) %}{% set night = now().hour >= 22 or now().hour < 8 %}{% set limit = 12 if night else 8 %}{% if b is none or k is none or (b - k) < limit %}false{% elif b >= 60 %}true{% else %}{% set bt = states('sensor.air_bathroom_temperature')|float(none) %}{% set ot = states('sensor.weather_aemet_temperature')|float(states('sensor.weather_meteo_france_les_corts_temperature')|float(none)) %}{% set oh = states('sensor.weather_aemet_humidity')|float(states('sensor.weather_meteo_france_les_corts_humidity')|float(none)) %}{% if bt is none or ot is none or oh is none %}true{% else %}{% set inside = b * e ** (17.67 * bt / (bt + 243.5)) / (bt + 273.15) %}{% set outside = oh * e ** (17.67 * ot / (ot + 243.5)) / (ot + 273.15) %}{{ (inside - outside) * 13.244 > 0.5 }}{% endif %}{% endif %}"
    - trigger: template
      id: normal
      value_template: "{% set b = states('sensor.air_bathroom_humidity')|float(none) %}{% set k = states('sensor.home_background_humidity')|float(none) %}{% set night = now().hour >= 22 or now().hour < 8 %}{% set limit = 7 if night else 5 %}{{ b is not none and k is not none and (b - k) < limit }}"
      for:
        hours: 0
        minutes: 5
        seconds: 0
    - trigger: numeric_state
      id: rising
      entity_id: sensor.bathroom_humidity_trend
      above: 1
    - trigger: state
      id: timeout
      entity_id: switch.wall_switch_bathroom_l2
      to: 'on'
      for:
        hours: 0
        minutes: 45
        seconds: 0
    - trigger: state
      id: stuck
      entity_id: switch.wall_switch_bathroom_l2
      to: 'on'
      for:
        hours: 2
        minutes: 0
        seconds: 0
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: high
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.wall_switch_bathroom_l2
        - conditions:
            - condition: trigger
              id:
                - rising
            - condition: time
              after: '08:00:00'
              before: '22:00:00'
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.wall_switch_bathroom_l2
        - conditions:
            - condition: trigger
              id: normal
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.wall_switch_bathroom_l2
        - conditions:
            - condition: trigger
              id: timeout
            - condition: template
              value_template: "{% set b = states('sensor.air_bathroom_humidity')|float(none) %}{% set k = states('sensor.home_background_humidity')|float(none) %}{{ b is none or k is none or (b - k) < 10 }}"
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.wall_switch_bathroom_l2
        - conditions:
            - condition: trigger
              id: stuck
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.wall_switch_bathroom_l2
  mode: single

- id: automation.co2_ventilation
  alias: Вентиляция для снижения CO²
  triggers:
    - trigger: state
      entity_id: input_boolean.empty_home
      to: 'off'
      id: occupied
    - trigger: state
      entity_id: input_boolean.empty_home
      to: 'on'
      id: empty
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: occupied
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.wall_switch_toilet_l2
        - conditions:
            - condition: trigger
              id: empty
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.wall_switch_toilet_l2
  mode: single

- id: automation.kitchen_fan_auto_off
  alias: Авто-выключение вентилятора на кухне
  room: kitchen
  triggers:
    - trigger: state
      entity_id: switch.wall_switch_kitchen_fan
      to: 'on'
      for:
        hours: 2
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.wall_switch_kitchen_fan
  mode: single

- id: automation.kitchen_fan_stove
  alias: Вентилятор на кухне при готовке
  room: kitchen
  triggers:
    - trigger: numeric_state
      entity_id: sensor.meter_panel_stove_power
      above: 500
      id: cooking
    - trigger: numeric_state
      entity_id: sensor.meter_panel_stove_power
      below: 100
      for:
        minutes: 20
      id: finished
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: cooking
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.wall_switch_kitchen_fan
        - conditions:
            - condition: trigger
              id: finished
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.wall_switch_kitchen_fan
  mode: single
