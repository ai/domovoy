- id: automation.andrey_shutter
  alias: Штора Андрея
  room: andrey
  triggers:
    - trigger: numeric_state
      entity_id:
        - sun.sun
      attribute: azimuth
      above: 245
      id: sun
    - trigger: numeric_state
      entity_id:
        - sun.sun
      attribute: elevation
      below: 13
      id: low_sun
    - trigger: time
      at: '01:00:00'
      id: heating_close
    - trigger: state
      entity_id: light.light_group_andrey
      to: 'off'
      for:
        minutes: 5
      id: heating_close
    - trigger: time
      at:
        entity_id: input_datetime.night_end
        offset: '-01:00:00'
      id: heating_open
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
    - condition: state
      entity_id: input_boolean.cat_alone
      state: 'off'
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: sun
            - condition: state
              entity_id: input_boolean.cooling
              state: 'on'
            - condition: state
              entity_id: binary_sensor.heating_sun
              state: 'on'
          sequence:
            - action: cover.set_cover_position
              target:
                entity_id: cover.shutter_andrey
              data:
                position: 50
        - conditions:
            - condition: trigger
              id: low_sun
            - condition: state
              entity_id: input_boolean.cooling
              state: 'on'
          sequence:
            - action: cover.open_cover
              target:
                entity_id: cover.shutter_andrey
        - conditions:
            - condition: trigger
              id: heating_close
            - condition: state
              entity_id: input_boolean.heating
              state: 'on'
            - condition: template
              value_template: "{{ today_at('01:00') <= now() < today_at(states('input_datetime.night_end')) - timedelta(hours=1) }}"
            - condition: state
              entity_id: light.light_group_andrey
              state: 'off'
              for:
                minutes: 5
          sequence:
            - action: cover.close_cover
              target:
                entity_id: cover.shutter_andrey
        - conditions:
            - condition: trigger
              id: heating_open
            - condition: state
              entity_id: input_boolean.heating
              state: 'on'
          sequence:
            - action: cover.open_cover
              target:
                entity_id: cover.shutter_andrey
  mode: single

- id: automation.bedroom_shutter
  alias: Штора спальни
  room: bedroom
  triggers:
    - trigger: time
      at:
        entity_id: input_datetime.night_end
        offset: '-01:00:00'
      id: open
    - trigger: time
      at:
        entity_id: input_datetime.night_end
        offset: '02:00:00'
      id: close
    - trigger: sun
      event: sunset
      id: heating_close
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
    - condition: state
      entity_id: input_boolean.cat_alone
      state: 'off'
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: open
            - condition: time
              weekday:
                - mon
                - tue
                - wed
                - thu
                - fri
            - condition: state
              entity_id: input_boolean.holidays
              state: 'off'
          sequence:
            - action: cover.open_cover
              target:
                entity_id: cover.shutter_bedroom
        - conditions:
            - condition: trigger
              id: close
            - condition: state
              entity_id: input_boolean.cooling
              state: 'on'
          sequence:
            - action: cover.set_cover_position
              target:
                entity_id: cover.shutter_bedroom
              data:
                position: 10
        - conditions:
            - condition: trigger
              id: heating_close
            - condition: state
              entity_id: input_boolean.heating
              state: 'on'
          sequence:
            - action: cover.set_cover_position
              target:
                entity_id: cover.shutter_bedroom
              data:
                position: 25
  mode: single

- id: automation.lounge_shutter
  alias: Штора зала
  room: lounge
  triggers:
    - trigger: numeric_state
      entity_id:
        - sun.sun
      attribute: azimuth
      above: 245
      id: propose
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: CLOSE_LOUNGE_SHUTTER
      id: close
    - trigger: numeric_state
      entity_id:
        - sun.sun
      attribute: elevation
      below: 17
      id: low_sun
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
    - condition: state
      entity_id: input_boolean.cat_alone
      state: 'off'
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: propose
            - condition: state
              entity_id: input_boolean.cooling
              state: 'on'
            - condition: state
              entity_id: person.andrey
              state: home
            - condition: state
              entity_id: binary_sensor.heating_sun
              state: 'on'
            - condition: numeric_state
              entity_id: cover.shutter_lounge
              attribute: current_position
              above: 60
          sequence:
            - action: notify.mobile_app_phone_bedoll
              data:
                title: Гостиная
                message: Прикрыть штору от солнца? Проверьте, что дверь свободна
                data:
                  tag: lounge_shutter
                  actions:
                    - action: CLOSE_LOUNGE_SHUTTER
                      title: Прикрыть
        - conditions:
            - condition: trigger
              id: close
            - condition: numeric_state
              entity_id: cover.shutter_lounge
              attribute: current_position
              above: 60
          sequence:
            - action: cover.set_cover_position
              target:
                entity_id: cover.shutter_lounge
              data:
                position: 40
            - action: notify.mobile_app_phone_bedoll
              data:
                message: clear_notification
                data:
                  tag: lounge_shutter
        - conditions:
            - condition: trigger
              id: low_sun
            - condition: state
              entity_id: input_boolean.cooling
              state: 'on'
          sequence:
            - action: cover.open_cover
              target:
                entity_id: cover.shutter_lounge
  mode: single

- id: automation.shutter_position_sync
  alias: Синхронизация штор
  triggers:
    - trigger: state
      entity_id:
        - cover.shutter_bedroom_wifi
        - cover.shutter_andrey_wifi
        - cover.shutter_lounge_wifi
      from:
        - opening
        - closing
    - trigger: time_pattern
      minutes: /30
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - delay: '00:00:03'
    - repeat:
        for_each:
          - Shutter / Bedroom
          - Shutter / Andrey
          - Shutter / Lounge
        sequence:
          - action: mqtt.publish
            data:
              topic: zigbee2mqtt/{{ repeat.item }}/get
              payload: '{"position":""}'
  mode: restart
