- id: automation.andrey_foot_heater
  alias: Грелка ног Андрея при работе за столом
  room: andrey
  triggers:
    - trigger: state
      entity_id: binary_sensor.presence_apollo_msr_2_radar_target
      to: 'on'
      id: 'on'
    - trigger: numeric_state
      entity_id: sensor.plug_andrey_desk_moshchnost
      above: 10
      id: 'on'
    - trigger: state
      entity_id: person.andrey
      to: home
      id: 'on'
    - trigger: state
      entity_id: binary_sensor.presence_apollo_msr_2_radar_target
      to: 'off'
      for:
        minutes: 2
      id: 'off'
    - trigger: numeric_state
      entity_id: sensor.plug_andrey_desk_moshchnost
      below: 10
      for:
        minutes: 2
      id: 'off'
    - trigger: state
      entity_id: person.andrey
      from: home
      id: 'off'
    - trigger: state
      entity_id: input_boolean.cat_alone
      to: 'on'
      id: 'off'
    - trigger: state
      entity_id: input_boolean.empty_home
      to: 'on'
      id: 'off'
    - trigger: numeric_state
      entity_id: sensor.plug_andrey_heater_moshchnost
      below: 5
      for:
        minutes: 1
      id: reset
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: 'on'
            - condition: state
              entity_id: person.andrey
              state: home
            - condition: state
              entity_id: binary_sensor.presence_apollo_msr_2_radar_target
              state: 'on'
            - condition: numeric_state
              entity_id: sensor.plug_andrey_desk_moshchnost
              above: 10
            - condition: state
              entity_id: input_boolean.cat_alone
              state: 'off'
            - condition: state
              entity_id: input_boolean.empty_home
              state: 'off'
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.plug_andrey_heater
        - conditions:
            - condition: trigger
              id: 'off'
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.plug_andrey_heater
        - conditions:
            - condition: trigger
              id: reset
            - condition: state
              entity_id: switch.plug_andrey_heater
              state: 'on'
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.plug_andrey_heater
            - delay:
                minutes: 3
            - if:
                - condition: state
                  entity_id: person.andrey
                  state: home
                - condition: state
                  entity_id: binary_sensor.presence_apollo_msr_2_radar_target
                  state: 'on'
                - condition: numeric_state
                  entity_id: sensor.plug_andrey_desk_moshchnost
                  above: 10
                - condition: state
                  entity_id: input_boolean.cat_alone
                  state: 'off'
                - condition: state
                  entity_id: input_boolean.empty_home
                  state: 'off'
              then:
                - action: switch.turn_on
                  target:
                    entity_id: switch.plug_andrey_heater
  mode: queued
  max: 20

- id: automation.lock_screen_on_andrey_leaving
  alias: Блокировка ноутбука Андрея при его уходе
  room: andrey
  triggers:
    - trigger: state
      entity_id: person.andrey
      to:
        - not_home
        - home
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - if:
        - condition: state
          entity_id: person.andrey
          state: home
      then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.auto_andrey_desk
      else:
        - action: mqtt.publish
          data:
            payload: LOCK
            topic: ai_laptop
            retain: true
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.auto_andrey_desk
  mode: restart

- id: automation.pause_laptop_on_bell
  alias: Пауза музыки на ноутбуке Андрея при звонке в дверь или домофон
  room: andrey
  triggers:
    - trigger: state
      entity_id: event.intercom_ring_ding
      not_to:
        - unavailable
        - unknown
    - trigger: state
      entity_id: binary_sensor.wall_switch_doorbell_input_0
      to: 'on'
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
    - condition: state
      entity_id: person.andrey
      state: home
  actions:
    - action: mqtt.publish
      data:
        payload: PAUSE
        topic: ai_laptop
  mode: single

- id: automation.start_screen_on_presence
  alias: Включение монитора Андрея по датчику присутствия
  room: andrey
  triggers:
    - trigger: state
      entity_id: binary_sensor.presence_apollo_msr_2_radar_target
      to: 'on'
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
    - condition: state
      entity_id: person.andrey
      state: home
    - condition: state
      entity_id: input_boolean.auto_andrey_desk
      state: 'on'
    - condition: time
      after: '06:00:00'
      before: '01:00:00'
  actions:
    - if:
        - condition: state
          entity_id: device_tracker.ip_savoia_ethernet
          state: home
      then:
        - action: mqtt.publish
          data:
            payload: WAKE
            topic: ai_laptop
  mode: restart
