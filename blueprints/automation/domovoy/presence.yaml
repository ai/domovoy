blueprint:
  name: Presence light
  description: Turns the light on while someone is in the room
  domain: automation
  author: Andrey Sitnik
  source_url: https://github.com/ai/domovoy/blob/main/blueprints/automation/domovoy/presence.yaml
  input:
    presence_sensor:
      name: Presence sensor
      selector:
        entity:
          filter:
            - device_class: occupancy
              domain: binary_sensor
            - device_class: motion
              domain: binary_sensor
            - device_class: presence
              domain: binary_sensor
    lights:
      name: Lights
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
    off_delay:
      name: Turn off delay
      description: How long the room must stay empty before turning off
      default:
        seconds: 0
      selector:
        duration: {}
    before_on:
      name: Extra action on turn on
      default: []
      selector:
        action: {}
    after_off:
      name: Extra action on turn off
      default: []
      selector:
        action: {}
    manual_flag:
      name: Manual flag
      description: >-
        input_boolean that blocks auto-off while it is on. Set by the wall
        switch blueprint when the light was turned on manually
      selector:
        entity:
          filter:
            - domain: input_boolean
    disable_flag:
      name: Disable flag
      description: >-
        input_boolean that blocks the automation while it is on, for instance,
        to ignore false detections in the empty home
      default: ''
      selector:
        entity:
          filter:
            - domain: input_boolean
    color_temp:
      name: Color temperature
      description: >-
        Sensor with the color temperature in K to turn the light on with
      default: ''
      selector:
        entity:
          filter:
            - domain: sensor
    brightness:
      name: Brightness
      description: >-
        Sensor with the brightness in % to turn the light on with
      default: ''
      selector:
        entity:
          filter:
            - domain: sensor

variables:
  lights: !input lights
  disable_flag: !input disable_flag
  color_temp: !input color_temp
  brightness: !input brightness

mode: restart

triggers:
  - trigger: state
    entity_id: !input presence_sensor
    from: 'off'
    to: 'on'

conditions:
  - condition: state
    entity_id: input_boolean.stop
    state: 'off'
  - condition: state
    entity_id: input_boolean.cat_alone
    state: 'off'
  - condition: state
    entity_id: !input manual_flag
    state: 'off'
  - condition: template
    value_template: "{{ disable_flag == '' or is_state(disable_flag, 'off') }}"

actions:
  - variables:
      off_lights: "{{ lights | select('is_state', 'off') | list }}"
  - sequence: !input before_on
  - if:
      - condition: template
        value_template: "{{ off_lights | count > 0 }}"
    then:
      - action: light.turn_on
        target:
          entity_id: "{{ off_lights }}"
        data: >-
          {{ ({} if color_temp == '' else
              { 'color_temp_kelvin': states(color_temp) | int(2700) })
             | combine({} if brightness == '' else
                       { 'brightness_pct': states(brightness) | int(100) }) }}
  - wait_for_trigger:
      trigger: state
      entity_id: !input presence_sensor
      from: 'on'
      to: 'off'
      for: !input off_delay
  - if:
      - condition: state
        entity_id: input_boolean.stop
        state: 'off'
      - condition: state
        entity_id: !input manual_flag
        state: 'off'
    then:
      - if:
          - condition: template
            value_template: "{{ lights | count > 0 }}"
        then:
          - action: light.turn_off
            target:
              entity_id: "{{ lights }}"
      - sequence: !input after_off
