- id: script.clean_cat_fountain
  alias: Помыли поилку кошке
  sequence:
    - action: button.press
      target:
        entity_id: button.fountain_dockstream_2_filter_reset
    - action: button.press
      target:
        entity_id: button.fountain_dockstream_2_cleaning_reset

- id: script.empty_home
  alias: Пометить дом пустым
  icon: mdi:home-export-outline
  mode: single
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.empty_home
    - action: timer.start
      target:
        entity_id: timer.empty_home
      data:
        duration: '00:30:00'

- id: script.shutter_down
  alias: Опустить шторы
  icon: mdi:window-shutter
  mode: single
  sequence:
    - action: cover.close_cover
      target:
        entity_id:
          - cover.shutter_andrey
          - cover.shutter_bedroom
          - cover.shutter_lounge

- id: script.shutter_up
  alias: Поднять шторы
  icon: mdi:window-shutter-open
  mode: single
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.cooling
              state: 'on'
            - condition: numeric_state
              entity_id: sun.sun
              attribute: elevation
              above: 12
            - condition: time
              after: '12:00:00'
            - condition: state
              entity_id: binary_sensor.heating_sun
              state: 'on'
          sequence:
            - action: cover.set_cover_position
              target:
                entity_id: cover.shutter_andrey
              data:
                position: 50
            - action: cover.set_cover_position
              target:
                entity_id: cover.shutter_lounge
              data:
                position: 40
            - action: notify.mobile_app_phone_bedoll
              data:
                message: clear_notification
                data:
                  tag: lounge_shutter
      default:
        - action: cover.open_cover
          target:
            entity_id:
              - cover.shutter_andrey
              - cover.shutter_lounge
    - if:
        - condition: state
          entity_id: input_boolean.cooling
          state: 'off'
      then:
        - action: cover.open_cover
          target:
            entity_id: cover.shutter_bedroom

- id: script.turn_off_everything
  alias: Выключить всё
  sequence:
    - action: light.turn_off
      target:
        entity_id:
          - light.light_group_kate
          - light.light_group_kate_ceiling
          - light.light_group_andrey
          - light.light_group_toilet
          - light.light_group_kitchen
          - light.light_group_bedroom
          - light.light_group_lounge
          - light.light_group_children
          - light.light_group_entrance
      data: {}
    - action: switch.turn_off
      target:
        entity_id:
          - switch.wall_switch_bathroom_l1
          - switch.switch_bathroom_mirror_l1
          - switch.switch_bathroom_mirror_l2
          - switch.floor_bathroom
          - switch.floor_lounge
          - switch.floor_toilet
          - switch.wall_switch_bedroom
      data: {}

- id: script.zigbee_reset
  alias: Сброс ламп Kajplats на Zigbee-режим
  use_blueprint:
    path: bonesderdritte/ikea_kajplats_zigbee_pairing_mode_power_cycle.yaml
    input:
      target_switch: switch.plug_washing_machine
      cycles: 12
      off_time: 1
      on_time: 1
