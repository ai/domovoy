- id: automation.arrived_home
  alias: Вернулись домой
  triggers:
    - trigger: state
      entity_id: input_boolean.empty_home
      to: 'off'
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
    - condition: state
      entity_id: input_boolean.cat_alone
      state: 'off'
  actions:
    - action: script.turn_on
      target:
        entity_id: script.shutter_up
    - if:
        - condition: state
          entity_id: vacuum.vacuum_q7_max
          state:
            - cleaning
            - paused
      then:
        - action: vacuum.return_to_base
          target:
            entity_id: vacuum.vacuum_q7_max
  mode: single

- id: automation.cat_alone_mode
  alias: Режим «Кошка одна»
  triggers:
    - trigger: state
      entity_id: input_boolean.cat_alone
      to: 'on'
      id: 'on'
    - trigger: state
      entity_id: input_boolean.cat_alone
      to: 'off'
      id: 'off'
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: 'on'
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.empty_home
            - action: cover.close_cover
              target:
                entity_id:
                  - cover.shutter_andrey
                  - cover.shutter_bedroom
            - action: cover.set_cover_position
              target:
                entity_id: cover.shutter_lounge
              data:
                position: 40
            - action: script.turn_off_everything
            - action: climate.turn_off
              target:
                entity_id:
                  - climate.ac_lounge
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.plug_andrey_desk
                  - switch.plug_dishwasher
                  - switch.plug_grill
                  - switch.plug_kettle
                  - switch.plug_microwave
                  - switch.plug_washing_machine
        - conditions:
            - condition: trigger
              id: 'off'
          sequence:
            - action: cover.open_cover
              target:
                entity_id:
                  - cover.shutter_andrey
                  - cover.shutter_lounge
            - action: cover.set_cover_position
              target:
                entity_id: cover.shutter_bedroom
              data:
                position: 10
            - action: switch.turn_on
              target:
                entity_id:
                  - switch.plug_andrey_desk
                  - switch.plug_dishwasher
                  - switch.plug_grill
                  - switch.plug_kettle
                  - switch.plug_microwave
                  - switch.plug_washing_machine
  mode: single

- id: automation.empty_home_button
  alias: Кнопка на выходе
  room: entrance
  triggers:
    - trigger: device
      domain: mqtt
      device_id: 051afa3d576af13df00f57ac4f8a7ff6
      type: action
      subtype: toggle_b1_down
      id: empty
    - trigger: device
      domain: mqtt
      device_id: 051afa3d576af13df00f57ac4f8a7ff6
      type: action
      subtype: toggle_b2_down
      id: shutters
    - trigger: device
      domain: mqtt
      device_id: 051afa3d576af13df00f57ac4f8a7ff6
      type: action
      subtype: toggle_b1_up
      id: clear
    - trigger: device
      domain: mqtt
      device_id: 051afa3d576af13df00f57ac4f8a7ff6
      type: action
      subtype: toggle_b2_up
      id: vacuum
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: clear
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.empty_home
        - conditions:
            - condition: trigger
              id: vacuum
          sequence:
            - action: vacuum.start
              target:
                entity_id: vacuum.vacuum_q7_max
        - conditions:
            - condition: trigger
              id: shutters
          sequence:
            - action: script.turn_on
              target:
                entity_id: script.empty_home
            - action: script.turn_on
              target:
                entity_id: script.shutter_down
      default:
        - action: script.turn_on
          target:
            entity_id: script.empty_home
  mode: single

- id: automation.empty_home_devices
  alias: Выключить всё в пустом доме
  triggers:
    - trigger: state
      entity_id: input_boolean.empty_home
      to: 'on'
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - action: script.turn_off_everything
    - action: climate.turn_off
      metadata: {}
      target:
        entity_id: climate.ac_andrey
      data: {}
  mode: single

- id: automation.empty_home_presence
  alias: Обновление «Пустой дом»
  room: entrance
  triggers:
    - trigger: state
      entity_id: binary_sensor.door_main
      from: 'off'
      to: 'on'
      id: arrived
    - trigger: state
      entity_id: zone.home
      to: '0'
      id: emptied
  conditions:
    - condition: state
      entity_id: input_boolean.stop
      state: 'off'
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: arrived
            - condition: state
              entity_id: input_boolean.empty_home
              state: 'on'
              for:
                hours: 0
                minutes: 3
                seconds: 0
            - condition: template
              value_template: '{% set since = states.input_boolean.empty_home.last_changed %}{{ states.person.andrey.last_changed > since or states.person.kate.last_changed > since }}'
            - condition: or
              conditions:
                - condition: state
                  entity_id: person.andrey
                  state: home
                - condition: zone
                  entity_id: person.andrey
                  zone: zone.near_home
                - condition: state
                  entity_id: person.kate
                  state: home
                - condition: zone
                  entity_id: person.kate
                  zone: zone.near_home
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.empty_home
            - action: light.turn_on
              target:
                entity_id: light.light_entrance_ceiling
        - conditions:
            - condition: trigger
              id: emptied
            - condition: state
              entity_id: timer.empty_home
              state: active
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.empty_home
  mode: single
